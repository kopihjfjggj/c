<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ED302 开源镜像站 - 欢迎使用</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232488cc'/%3E%3Ctext x='32' y='45' font-size='30' font-weight='bold' text-anchor='middle' fill='white'%3EED%3C/text%3E%3C/svg%3E">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft Yahei","PingFang SC",system-ui,sans-serif; }
        :root{
            --bg0:#0b1120; --bg1:#15243c;
            --accent:#3aa0ff; --accent2:#7cdbff;
            --card:rgba(255,255,255,.055); --card-border:rgba(122,180,255,.16);
            --text:#eaf1fb; --muted:#a9bcd6;
        }
        body{ background:var(--bg0); color:var(--text); min-height:100vh; line-height:1.7; }
        body::before{
            content:""; position:fixed; inset:0; z-index:-1;
            background:
                radial-gradient(700px 420px at 15% -10%, rgba(58,160,255,.22), transparent 60%),
                radial-gradient(700px 460px at 90% 8%, rgba(124,219,255,.14), transparent 60%),
                linear-gradient(160deg,var(--bg0),var(--bg1));
        }
        .container{ max-width:1120px; margin:0 auto; padding:24px 20px; }

        /* 页头导航 */
        .topbar{ display:flex; align-items:center; justify-content:space-between; padding:18px 0; }
        .brand{ display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:1px; }
        .brand .mark{
            width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
            background:linear-gradient(135deg,#2488cc,#3aa0ff); font-size:15px; color:#fff; box-shadow:0 4px 14px rgba(58,160,255,.35);
        }
        .topnav{ display:flex; gap:8px; }
        .topnav button{
            padding:9px 18px; border-radius:9px; border:1px solid var(--card-border);
            background:var(--card); color:var(--text); font-size:14px; cursor:pointer; transition:.2s;
        }
        .topnav button:hover{ background:rgba(58,160,255,.18); border-color:var(--accent); }
        .topnav button.active{ background:linear-gradient(135deg,#2488cc,#3aa0ff); border-color:transparent; color:#fff; }

        /* Hero */
        .hero{ text-align:center; padding:52px 10px 40px; }
        .hero .pill{
            display:inline-block; font-size:13px; letter-spacing:2px; color:var(--accent2);
            border:1px solid rgba(124,219,255,.35); padding:6px 16px; border-radius:20px; margin-bottom:22px;
        }
        .hero h1{ font-size:46px; line-height:1.2; font-weight:800; margin-bottom:16px; }
        .hero h1 .grad{ background:linear-gradient(90deg,#5cc8ff,#3aa0ff,#7cdbff); -webkit-background-clip:text; background-clip:text; color:transparent; }
        .hero .sub{ font-size:18px; color:var(--muted); max-width:620px; margin:0 auto; }
        .hero-cta{ margin-top:34px; }
        .btn{
            display:inline-flex; align-items:center; gap:9px;
            padding:15px 40px; border-radius:12px; text-decoration:none; font-weight:700; font-size:17px;
            background:linear-gradient(135deg,#2488cc,#3aa0ff); color:#fff; box-shadow:0 8px 22px rgba(58,160,255,.35); transition:.25s;
        }
        .btn:hover{ transform:translateY(-2px); box-shadow:0 12px 28px rgba(58,160,255,.45); }

        /* 通用区块 */
        .section{ margin:44px 0; }
        .sec-title{ text-align:center; margin-bottom:28px; }
        .sec-title h2{ font-size:27px; font-weight:800; }
        .sec-title p{ color:var(--muted); font-size:15px; margin-top:6px; }

        /* 特性卡片 */
        .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
        .card{
            background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:26px 24px;
            transition:.25s; position:relative; overflow:hidden;
        }
        .card::before{ content:""; position:absolute; left:0; top:0; width:100%; height:2px;
            background:linear-gradient(90deg,transparent,#3aa0ff,transparent); opacity:0; transition:.3s; }
        .card:hover{ transform:translateY(-6px); border-color:var(--accent); background:rgba(255,255,255,.08); }
        .card:hover::before{ opacity:1; }
        .card .ico{
            width:46px;height:46px;border-radius:12px;display:grid;place-items:center;margin-bottom:16px;
            background:rgba(58,160,255,.16); color:var(--accent2);
        }
        .card .ico svg{ width:24px;height:24px; }
        .card h3{ font-size:19px; font-weight:700; margin-bottom:9px; }
        .card p{ font-size:14px; color:var(--muted); }

        /* 使用步骤 */
        .steps{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
        .step{
            background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:26px 24px;
            display:flex; gap:16px; align-items:flex-start;
        }
        .step .num{
            flex:none; width:34px;height:34px;border-radius:50%; display:grid;place-items:center;
            background:linear-gradient(135deg,#2488cc,#3aa0ff); color:#fff; font-weight:800; font-size:16px;
        }
        .step h4{ font-size:17px; margin-bottom:4px; }
        .step p{ font-size:14px; color:var(--muted); }

        /* 下载页 */
        .dl-hero{ text-align:center; padding:30px 10px 10px; }
        .dl-hero h1{ font-size:32px; font-weight:800; }
        .dl-hero p{ color:var(--muted); margin-top:6px; }
        .backlink{ display:inline-flex; align-items:center; gap:6px; color:var(--accent2); text-decoration:none; font-size:15px; margin:18px 0 6px; }
        .backlink:hover{ text-decoration:underline; }
        .mirror{
            background:var(--card); border:1px solid var(--card-border); border-radius:18px; overflow:hidden;
            display:grid; grid-template-columns:300px 1fr; margin-top:20px;
        }
        .mirror img{ width:100%; height:100%; object-fit:cover; display:block; }
        .mirror .info{ padding:30px; display:flex; flex-direction:column; }
        .mirror h2{ font-size:24px; font-weight:800; margin-bottom:12px; }
        .mirror .info>p{ color:var(--muted); font-size:15px; margin-bottom:14px; }
        .tag{ display:inline-flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
        .tag span{
            font-size:12px; padding:4px 12px; border-radius:20px;
            border:1px solid var(--card-border); background:rgba(255,255,255,.05); color:#cfe3ff;
        }
        .dl-row{ margin-top:auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .btn-sm{ padding:11px 26px; border-radius:10px; font-size:15px; }

        footer{ text-align:center; padding:40px 20px; margin-top:40px; color:#7d8fa8; font-size:13px; border-top:1px solid rgba(255,255,255,.06); }
