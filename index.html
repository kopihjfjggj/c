<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ED302 镜像站</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
        body{background:linear-gradient(135deg,#0b1020,#152240);color:#fff;min-height:100vh}
        .container{max-width:1100px;margin:0 auto;padding:20px}
        header{text-align:center;padding:40px 20px}
        h1{font-size:2.2rem;margin-bottom:12px}
        .desc{color:#b8c8e8;font-size:1rem}
        nav{text-align:center;margin:30px 0}
        .nav-btn{padding:12px 24px;margin:0 8px;background:#254b96;border:none;border-radius:8px;color:#fff;font-size:1rem;cursor:pointer}
        .nav-btn:hover{background:#3462c2}
        .page{display:none}
        .page.active{display:block}
        .card-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:30px}
        .card{background:rgba(255,255,255,0.08);border-radius:12px;padding:24px;border:1px solid rgba(255,255,255,0.12)}
        .card h3{margin-bottom:10px}
        .card p{color:#c0cde2;margin-bottom:16px;line-height:1.5}
        .btn{display:inline-block;padding:10px 20px;background:#2956b8;border-radius:8px;color:#fff;text-decoration:none}
        .btn:hover{background:#3b6cd6}
        footer{text-align:center;margin-top:60px;padding:20px;color:#8898b8;font-size:0.9rem}
    </style>
</head>
<body>
    <div class="container">
        <!-- 首页 -->
        <div id="page-home" class="page active">
            <header>
                <h1>ED302 镜像站</h1>
                <p class="desc">欢迎使用镜像站，提供系统镜像与工具下载</p>
            </header>
            <nav>
                <button class="nav-btn" onclick="showPage('page-home')">首页</button>
                <button class="nav-btn" onclick="showPage('page-download')">进入下载链接</button>
            </nav>
            <div class="card-wrap">
                <div class="card">
                    <h3>Windows 镜像</h3>
                    <p>自制精简Windows XP镜像，适配QEMU虚拟机</p>
                </div>
                <div class="card">
                    <h3>壁纸资源</h3>
                    <p>高清电脑壁纸合集</p>
                </div>
                <div class="card">
                    <h3>软件源加速</h3>
                    <p>开源软件镜像加速服务</p>
                </div>
                <div class="card">
                    <h3>内网穿透工具</h3>
                    <p>简单易用内网穿透，搭配KSWEB搭建网站</p>
                </div>
            </div>
        </div>

        <!-- 下载页 -->
        <div id="page-download" class="page">
            <header>
                <h1>下载中心</h1>
                <p class="desc">系统镜像下载</p>
            </header>
            <nav>
                <button class="nav-btn" onclick="showPage('page-home')">返回首页</button>
                <button class="nav-btn" onclick="showPage('page-download')">下载中心</button>
            </nav>
            <div class="card-wrap">
                <div class="card">
                    <h3>自制 Windows XP</h3>
                    <p>QEMU专用精简镜像</p>
                    <a href="https://pan.sysri.cn/s/eOVeH6" target="_blank" class="btn">下载镜像</a>
                </div>
            </div>
        </div>

        <footer>
            ED302镜像站 © 2026
        </footer>
    </div>

    <script>
        function showPage(pageId){
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'))
            document.getElementById(pageId).classList.add('active')
        }
    </script>
</body>
</html>
